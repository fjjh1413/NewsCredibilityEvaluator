services:
  backend:
    environment:
      BACKEND_CORS_ORIGINS: https://${DOMAIN:?Set DOMAIN in your environment or .env}
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-true}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.10}
      PYROSCOPE_ENABLED: ${PYROSCOPE_ENABLED:-true}
      PYROSCOPE_REQUIRED: ${PYROSCOPE_REQUIRED:-false}
      PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS:-http://pyroscope:4040}
      PYROSCOPE_APPLICATION_NAME: ${PYROSCOPE_APPLICATION_NAME:-newscred}
      PYROSCOPE_SAMPLE_RATE: ${PYROSCOPE_SAMPLE_RATE:-100}
    depends_on:
      otel-collector:
        condition: service_started
      pyroscope:
        condition: service_started

  worker:
    environment:
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYROSCOPE_ENABLED: ${PYROSCOPE_ENABLED:-true}
      PYROSCOPE_REQUIRED: ${PYROSCOPE_REQUIRED:-false}
      PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS:-http://pyroscope:4040}
      PYROSCOPE_APPLICATION_NAME: ${PYROSCOPE_APPLICATION_NAME:-newscred}
      PYROSCOPE_SAMPLE_RATE: ${PYROSCOPE_SAMPLE_RATE:-100}
    depends_on:
      pyroscope:
        condition: service_started

  caddy:
    image: caddy:2.8-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in your environment or .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in your environment or .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_started
      alertmanager:
        condition: service_started
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./deploy/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

  pyroscope:
    image: grafana/pyroscope:2.1.0
    command:
      - server
      - --storage-path=/var/lib/pyroscope
    volumes:
      - pyroscope_data:/var/lib/pyroscope
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command:
      - --config=/etc/otelcol-contrib/otel-collector.yml
    volumes:
      - ./deploy/otel-collector/otel-collector.yml:/etc/otelcol-contrib/otel-collector.yml:ro
    depends_on:
      tempo:
        condition: service_started
      pyroscope:
        condition: service_started
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    depends_on:
      feishu-alerts:
        condition: service_healthy
    restart: unless-stopped

  feishu-alerts:
    image: python:3.12-alpine
    environment:
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:?Set FEISHU_WEBHOOK_URL in your environment or .env}
      FEISHU_ALERT_TITLE: ${FEISHU_ALERT_TITLE:-NewsCred 告警}
    command: ["python", "/app/feishu_alerts.py"]
    volumes:
      - ./deploy/alertmanager/feishu_alerts.py:/app/feishu_alerts.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in your environment or .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      pyroscope:
        condition: service_started
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  tempo_data:
  pyroscope_data:
