name: news-credibility-evaluator

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your environment or .env}
      MYSQL_DATABASE: zhiyun_bianzhen
      MYSQL_USER: newscred
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in your environment or .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend_environment
      APP_ENV: production
      PROJECT_NAME: zhiyun-bianzhen-backend
      PROJECT_VERSION: 0.1.0
      API_PREFIX: /api
      BACKEND_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      TRUSTED_PROXY_IPS: 172.16.0.0/12
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: newscred
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in your environment or .env}
      DATABASE_NAME: zhiyun_bianzhen
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your environment or .env}
      FIRST_SUPERUSER_USERNAME: ${FIRST_SUPERUSER_USERNAME:-admin}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Set FIRST_SUPERUSER_PASSWORD in your environment or .env}
      FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL:-admin@example.com}
      CHROMA_PERSIST_DIR: /data/chroma
      REPORT_DIR: /data/reports
      REDIS_ENABLED: "true"
      REDIS_REQUIRED: "true"
      REDIS_URL: redis://redis:6379/0
      CACHE_KEY_PREFIX: newscred
      ASYNC_DETECTION_ENABLED: ${ASYNC_DETECTION_ENABLED:-false}
      ASYNC_TASK_ALWAYS_EAGER: "false"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
      AI_CACHE_ENABLED: ${AI_CACHE_ENABLED:-true}
      AI_CACHE_TTL_SECONDS: ${AI_CACHE_TTL_SECONDS:-3600}
      WEB_SEARCH_CACHE_ENABLED: ${WEB_SEARCH_CACHE_ENABLED:-true}
      WEB_SEARCH_CACHE_TTL_SECONDS: ${WEB_SEARCH_CACHE_TTL_SECONDS:-900}
      EMBEDDING_CACHE_ENABLED: ${EMBEDDING_CACHE_ENABLED:-true}
      EMBEDDING_CACHE_TTL_SECONDS: ${EMBEDDING_CACHE_TTL_SECONDS:-86400}
      REPORT_GENERATION_CACHE_ENABLED: ${REPORT_GENERATION_CACHE_ENABLED:-true}
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-newscred-backend}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.10}
      PYROSCOPE_ENABLED: ${PYROSCOPE_ENABLED:-false}
      PYROSCOPE_REQUIRED: ${PYROSCOPE_REQUIRED:-false}
      PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS:-http://127.0.0.1:4040}
      PYROSCOPE_APPLICATION_NAME: ${PYROSCOPE_APPLICATION_NAME:-newscred}
      PYROSCOPE_SAMPLE_RATE: ${PYROSCOPE_SAMPLE_RATE:-100}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dashscope}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-replace_with_dashscope_api_key}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-replace_with_deepseek_api_key}
      BOCHA_API_KEY: ${BOCHA_API_KEY:-replace_with_bocha_api_key}
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-true}
      CRAWL_ENABLED: ${CRAWL_ENABLED:-true}
      CRAWL_ALLOW_PRIVATE_HOSTS: "false"
      ARTICLE_FETCH_ALLOW_PRIVATE_HOSTS: "false"
    volumes:
      - chroma_data:/data/chroma
      - report_data:/data/reports
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - celery
      - -A
      - app.worker.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    environment:
      <<: *backend_environment
    volumes:
      - chroma_data:/data/chroma
      - report_data:/data/reports
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The shared image's default healthcheck targets Uvicorn. A worker needs
    # its own Celery probe instead of an HTTP endpoint it does not serve.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; from app.worker import celery_app; replies = celery_app.control.ping(destination=['celery@' + socket.gethostname()], timeout=5); assert any(reply.get('celery@' + socket.gethostname(), {}).get('ok') == 'pong' for reply in replies), replies"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  chroma_data:
  report_data:
