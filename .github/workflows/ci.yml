name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run tests
        env:
          PYTHON_DOTENV_DISABLED: "1"
          DATABASE_URL: "sqlite:///:memory:"
          APP_ENV: testing
          KNOWLEDGE_INDEX_JOB_ENABLED: "false"
          P0_ARTIFACT_DIR: ../.artifacts/p0/scenarios
          SECRET_KEY: ci-secret-key-0000000000000000000000000001
          BACKEND_CORS_ORIGINS: "*"
          REDIS_ENABLED: "false"
          REDIS_REQUIRED: "false"
          EMBEDDING_PROVIDER: hash
          WEB_SEARCH_ENABLED: "false"
          CRAWL_ENABLED: "false"
        run: |
          set -o pipefail
          mkdir -p ../.artifacts/p0
          python ../scripts/ci/write_source_manifest.py --output ../.artifacts/p0/source-manifest.json
          python -m unittest discover -s tests -p "test_*.py" 2>&1 | tee ../.artifacts/p0/backend-tests.log

      - name: Upload backend test log and P0 scenario artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-and-p0-scenarios
          path: |
            .artifacts/p0/backend-tests.log
            .artifacts/p0/source-manifest.json
            .artifacts/p0/scenarios/
          if-no-files-found: warn

      - name: Run complete evaluation tests and AI engineering gate
        working-directory: .
        env:
          PYTHON_DOTENV_DISABLED: "1"
          SECRET_KEY: ci-secret-key-0000000000000000000000000001
          REDIS_ENABLED: "false"
          EMBEDDING_PROVIDER: hash
          WEB_SEARCH_ENABLED: "false"
          CRAWL_ENABLED: "false"
        run: |
          python -m pytest evaluation/tests -q
          python -m evaluation.ai_engineering.runner --cases evaluation/ai_engineering/sample_cases.jsonl --output .artifacts/ai_eval/summary.json

  frontend:
    name: Frontend Tests And Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Set up Chrome for Lighthouse CI
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Run Lighthouse CI performance budget
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run lhci

      - name: Upload Lighthouse CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouseci
          path: .lighthouseci/
          if-no-files-found: ignore

  docker:
    name: Docker Build And Config
    runs-on: ubuntu-latest
    # Also required by diagnostic and cleanup steps: Compose interpolates the
    # complete file even when only running ps/logs/down.
    env:
      SECRET_KEY: ci-secret-key-0000000000000000000000000001
      MYSQL_ROOT_PASSWORD: ci-mysql-root-password
      MYSQL_PASSWORD: ci-mysql-password
      FIRST_SUPERUSER_PASSWORD: ci-admin-password
      EMBEDDING_PROVIDER: hash
      WEB_SEARCH_ENABLED: "false"
      CRAWL_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose files
        env:
          SECRET_KEY: ci-secret-key-0000000000000000000000000001
          MYSQL_ROOT_PASSWORD: ci-mysql-root-password
          MYSQL_PASSWORD: ci-mysql-password
          FIRST_SUPERUSER_PASSWORD: ci-admin-password
          DOMAIN: example.com
          ACME_EMAIL: ops@example.com
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
          FEISHU_WEBHOOK_URL: https://open.feishu.cn/open-apis/bot/v2/hook/ci-placeholder
          EMBEDDING_PROVIDER: hash
          WEB_SEARCH_ENABLED: "false"
          CRAWL_ENABLED: "false"
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Test Feishu alert bridge
        run: python deploy/alertmanager/test_feishu_alerts.py

      - name: Validate backup scripts
        run: |
          sh -n scripts/backup/backup_docker_stack.sh
          sh -n scripts/backup/restore_docker_stack.sh

      - name: Validate Prometheus config
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/prometheus:/etc/prometheus" \
            prom/prometheus:v2.55.1 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Alertmanager config
        run: |
          docker run --rm --entrypoint amtool \
            -v "$PWD/deploy/alertmanager:/etc/alertmanager" \
            prom/alertmanager:v0.27.0 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Validate Caddy config
        env:
          DOMAIN: example.com
          ACME_EMAIL: ops@example.com
        run: |
          docker run --rm \
            -e DOMAIN \
            -e ACME_EMAIL \
            -v "$PWD/deploy/caddy:/etc/caddy" \
            caddy:2.8-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Build application images
        env:
          SECRET_KEY: ci-secret-key-0000000000000000000000000001
          MYSQL_ROOT_PASSWORD: ci-mysql-root-password
          MYSQL_PASSWORD: ci-mysql-password
          FIRST_SUPERUSER_PASSWORD: ci-admin-password
          EMBEDDING_PROVIDER: hash
          WEB_SEARCH_ENABLED: "false"
          CRAWL_ENABLED: "false"
        run: |
          set -o pipefail
          mkdir -p .artifacts/container-smoke
          docker compose build backend worker frontend 2>&1 | tee .artifacts/container-smoke/build.log

      - name: Verify packaged API and worker contract
        env:
          SECRET_KEY: ci-secret-key-0000000000000000000000000001
          MYSQL_ROOT_PASSWORD: ci-mysql-root-password
          MYSQL_PASSWORD: ci-mysql-password
          FIRST_SUPERUSER_PASSWORD: ci-admin-password
          EMBEDDING_PROVIDER: hash
          WEB_SEARCH_ENABLED: "false"
          CRAWL_ENABLED: "false"
        run: |
          set -o pipefail
          docker compose run --rm --no-deps backend python /app/verify_runtime_package.py 2>&1 | tee .artifacts/container-smoke/backend.log
          docker compose run --rm --no-deps worker python /app/verify_runtime_package.py 2>&1 | tee .artifacts/container-smoke/worker.log

      - name: Run k6 API performance budget
        env:
          SECRET_KEY: ci-secret-key-0000000000000000000000000001
          MYSQL_ROOT_PASSWORD: ci-mysql-root-password
          MYSQL_PASSWORD: ci-mysql-password
          FIRST_SUPERUSER_PASSWORD: ci-admin-password
          EMBEDDING_PROVIDER: hash
          WEB_SEARCH_ENABLED: "false"
          CRAWL_ENABLED: "false"
          PYROSCOPE_ENABLED: "false"
        run: |
          mkdir -p .artifacts/k6
          docker compose up -d --wait mysql redis
          docker compose run --rm --no-deps backend python -m app.db.migrate
          docker compose up -d --wait backend worker frontend
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/ready > .artifacts/container-smoke/ready.json; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/ > .artifacts/container-smoke/frontend.html
          curl -fsS http://127.0.0.1:8080/api/ready > .artifacts/container-smoke/ready.json
          docker run --rm \
            --network news-credibility-evaluator_default \
            -v "$PWD/performance/k6:/scripts:ro" \
            -v "$PWD/.artifacts/k6:/out" \
            -e BASE_URL=http://backend:8000/api \
            -e VUS=2 \
            -e DURATION=30s \
            grafana/k6:2.1.0 run --summary-export /out/summary.json /scripts/ci-budget.js

      - name: Upload k6 performance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-budget
          path: .artifacts/k6/
          if-no-files-found: ignore

      - name: Capture application container diagnostics
        if: always()
        run: |
          mkdir -p .artifacts/container-smoke
          docker compose ps -a > .artifacts/container-smoke/status.log
          docker compose logs --no-color backend worker frontend > .artifacts/container-smoke/runtime.log 2>&1

      - name: Upload application packaging smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-container-smoke
          path: .artifacts/container-smoke/
          if-no-files-found: ignore

      - name: Stop compose stack
        if: always()
        run: docker compose down -v

  security:
    name: Dependency And Container Scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements-test.txt --strict --ignore-vuln PYSEC-2026-311

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
