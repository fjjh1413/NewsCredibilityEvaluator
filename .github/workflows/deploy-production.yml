name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref, tag, or SHA to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy To Production Host
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          APP_DIR: ${{ secrets.PRODUCTION_APP_DIR }}
          DEPLOY_REF: ${{ inputs.ref }}
        run: |
          test -n "$SSH_USER"
          test -n "$APP_DIR"
          ssh -i ~/.ssh/production_key "$SSH_USER@$SSH_HOST" "
            set -eu
            cd '$APP_DIR'
            git fetch --all --tags
            git checkout '$DEPLOY_REF'
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build backend frontend
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend python -m app.db.migrate
            curl -fsS https://\$DOMAIN/api/ready
          "
